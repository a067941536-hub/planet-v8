    var pts=c[2].map(function(s){var h=altaz(s.ra,s.dec,d);return {p:proj(h),alt:h.alt,az:h.az,s:s};}),isZ=ZODIAC.indexOf(c[0])>=0,hi=(c[0]===S.sign),sc=(c[0]===sunCon);

      c[3].forEach(function(e){var A=pts[e[0]],B=pts[e[1]];if(A.alt<-.02||B.alt<-.02||!A.p.ok||!B.p.ok)return;ctx.beginPath();ctx.moveTo(A.p.x,A.p.y);ctx.lineTo(B.p.x,B.p.y);ctx.stroke();});}
    pts.forEach(function(o){if(o.alt<0||!o.p.ok)return;var r=Math.max(.8,3.4-o.s.mag*.55),a=starA*(.55+.45*Math.min(1,(5-o.s.mag)/3));
      ctx.fillStyle=hi?'rgba(253,231,165,'+a+')':'rgba(235,240,255,'+a+')';ctx.beginPath();ctx.arc(o.p.x,o.p.y,r*(hi?1.3:1),0,PI*2);ctx.fill();

      if(o.s.zh){var inf=SM.INFO[o.s.zh]||[0,''];S.hits.push({x:o.p.x,y:o.p.y,r:12,n:o.s.zh,info:{type:'恆星・'+c[1],title:o.s.zh,kv:[['星等',o.s.mag.toFixed(1)],['距離',inf[0]?'約 '+inf[0].toLocaleString('en-US')+' 光年':'—'],['高度',(o.alt/D2R).toFixed(0)+'°'],['方位',dirName(o.az)+'方']],note:inf[1]||'屬於'+c[1]+'的亮星。'}});
        if(S.tg.names&&starA>.4){ctx.fillStyle='rgba(205,215,255,.7)';ctx.textAlign='left';ctx.font='11px '+FONT;ctx.fillText(o.s.zh,o.p.x+6,o.p.y-5);ctx.textAlign='center';ctx.font='500 12px '+FONT;}}});
    var vis=pts.filter(function(o){return o.alt>.05&&o.p.ok;});

  });
  SM.BRIGHT.forEach(function(s){var h=altaz(s.ra,s.dec,d);if(h.alt<0)return;var o=proj(h);if(!o.ok)return;var r=Math.max(1,3.6-s.mag*.5);ctx.fillStyle='rgba(235,240,255,'+starA+')';ctx.beginPath();ctx.arc(o.x,o.y,r,0,PI*2);ctx.fill();

  // 流星雨輻射點
  if(S.tg.show)SM.SHOWERS.forEach(function(s){var df=dayDiff(s,Y,MO,DA),act=Math.max(0,1-Math.abs(df)/Math.max(s.hw,3)),pk=Math.abs(df)<=s.hw;if(!pk&&Math.abs(df)>25)return;var h=altaz(s.ra,s.dec,d);if(h.alt<-.02)return;var o=proj(h);if(!o.ok)return;
    var a=pk?(.55+.45*act):.22;ctx.save();ctx.translate(o.x,o.y);ctx.strokeStyle='rgba(255,220,150,'+a*Math.max(.3,starA)+')';ctx.lineWidth=1.3;for(var i=0;i<8;i++){var an=i*PI/4;ctx.beginPath();ctx.moveTo(Math.cos(an)*4,Math.sin(an)*4);ctx.lineTo(Math.cos(an)*(pk?13:8),Math.sin(an)*(pk?13:8));ctx.stroke();}ctx.restore();
    if(pk&&starA>.3){ctx.fillStyle='rgba(255,226,170,.95)';ctx.textAlign='left';ctx.font='500 12px '+FONT;ctx.fillText('✦ '+s.n,o.x+16,o.y+4);ctx.textAlign='center';}
    S.hits.push({x:o.x,y:o.y,r:16,n:s.n+(pk?'（活躍中）':'（輻射點）'),shower:s});});
  ctx.restore();
  // 太陽、月、行星
  var objs=[],PCOL={mercury:['水星','#b3aca2'],venus:['金星','#fff0c2'],mars:['火星','#ff7a50'],jupiter:['木星','#f3dcb8'],saturn:['土星','#e8d19a']};
  function put(name,ic,eq,color,r,extra,info){var h=altaz(eq.ra,eq.dec,d),o=proj(h);objs.push({n:name,ic:ic,h:h,extra:extra,color:color});if(h.alt<-.02||!o.ok)return;
    ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,PI*2);ctx.clip();var gg=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,r*5);gg.addColorStop(0,color);gg.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=.5;ctx.fillStyle=gg;ctx.beginPath();ctx.arc(o.x,o.y,r*5,0,PI*2);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle=color;ctx.beginPath();ctx.arc(o.x,o.y,r,0,PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='600 12px '+FONT;ctx.textAlign='left';ctx.fillText(name,o.x+r+5,o.y+4);ctx.restore();
    if(info){info.kv=[['高度',(h.alt/D2R).toFixed(0)+'°'],['方位',dirName(h.az)+'方']].concat(info.kv||[]);S.hits.push({x:o.x,y:o.y,r:Math.max(14,r+6),n:name,info:info,pri:2});}}
  put('太陽','☀',sEq,'#ffd36b',9,null,{type:'恆星（我們的太陽）',title:'太陽',kv:[['距離','約 1 AU（1.5 億公里）'],['所在方向',ZH[sunCon]||'']],note:'太陽在天上時，天空太亮，看不到星星；占星學的太陽星座和它實際所在的星座約差一個月。'});
  var mo=ASTRO.moon(d),mEq=ASTRO.eclToEq(mo.lon,mo.lat,d),el=((mo.lon-sun.lon)/D2R%360+360)%360,illum=(1-Math.cos(el*D2R))/2,ph=['新月','眉月','上弦月','盈凸月','滿月','虧凸月','下弦月','殘月'][Math.round(el/45)%8];
  put('月 '+ph,'☾',mEq,'#e8ecf5',6.5,Math.round(illum*100)+'% 亮面',{type:'月球',title:'月 · '+ph,kv:[['亮面',Math.round(illum*100)+'%'],['距離','約 '+Math.round(mo.dist/1000)*1000+' 公里']],note:'月亮約每 29.5 天完成一次盈虧。月光較亮時，暗的流星和星雲都比較不容易看到。'});
  Object.keys(PCOL).forEach(function(id){var gz=ASTRO.geo(id,d),e=ASTRO.eclToEq(gz.lon,0,d);var cn=conOf(gz.lon/D2R);put(PCOL[id][0],'●',e,PCOL[id][1],id==='venus'||id==='jupiter'?3.8:3,null,{type:'行星',title:PCOL[id][0],kv:[['距離地球',gz.dist.toFixed(2)+' AU'],['光走過來',(gz.dist*8.317).toFixed(1)+' 分鐘'],['目前在',(ZH[cn]||'')+'方向']],note:PINFO[id]});objs[objs.length-1].pid=id;});
  // 地平與方位
  ctx.strokeStyle='rgba(180,195,255,.6)';ctx.lineWidth=1.6;curve(function(t){return {alt:0,az:t*2*PI};},180);
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,PI*2);ctx.clip();ctx.fillStyle='#fff';ctx.font='700 14px '+FONT;ctx.textAlign='center';
  [['北',0],['東',90],['南',180],['西',270]].forEach(function(c){var o=proj({alt:3*D2R,az:c[1]*D2R});if(o.ok)ctx.fillText(c[0],o.x,o.y+5);});
  var zo=proj({alt:PI/2-.0001,az:0});if(zo.ok){ctx.fillStyle='rgba(200,210,255,.55)';ctx.font='11px '+FONT;ctx.fillText('天頂',zo.x,zo.y-6);}ctx.restore();
  ctx.strokeStyle='rgba(180,195,255,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,R,0,PI*2);ctx.stroke();
  var pl=SM.PLACES[S.place];
  document.getElementById('timeRead').firstChild.nodeValue=pad(Math.floor(S.min/60))+':'+pad(Math.floor(S.min%60));
  document.getElementById('dateRead').textContent=S.date.replace(/-/g,'.')+' · '+pl[0]+'（太陽高度 '+sunAlt.toFixed(0)+'°，'+(sunAlt>0?'白天':(sunAlt>-6?'暮光':(sunAlt>-18?'天文暮光':'夜晚')))+'）';
  var h='';objs.forEach(function(o){var alt=o.h.alt/D2R,up=alt>0,ok=o.pid?(alt>5&&sunAlt<-5):(up&&o.n[0]==='月'&&sunAlt<0);

  if(h!==frame.h){document.getElementById('objs').innerHTML=h;frame.h=h;}
  var sh=showerPanel(Y,MO,DA);if(sh!==frame.sh){document.getElementById('showers').innerHTML=sh;frame.sh=sh;}
  var sb='今天太陽位在<b>'+(ZH[sunCon]||'')+'</b>的方向（依天文位置）。'+(ZODIAC.indexOf(sunCon)>=0?'<a href="zodiac/zodiac_'+sunCon+'.html">看'+ZH[sunCon]+'運勢 →</a>':'')+'<br><span style="opacity:.85">占星學的「太陽星座」按日期劃分，和太陽實際所在的星座約差一個月；而且太陽在天上時，它所在的星座反而看不見。</span>';
  if(sb!==frame.s){document.getElementById('sunBox').innerHTML=sb;frame.s=sb;}
  requestAnimationFrame(frame);
}
/* ---------- 互動：拖曳旋轉、縮放、點選 ---------- */
var drag=null;
function pickHit(x,y){var b=null,bd=1e9;S.hits.forEach(function(h){var dd=Math.hypot(h.x-x,h.y-y)-(h.pri||0)*2;if(dd<h.r&&dd<bd){bd=dd;b=h;}});return b;}
cv.addEventListener('pointerdown',function(e){cv.setPointerCapture(e.pointerId);drag={x:e.offsetX,y:e.offsetY,az:V.taz,alt:V.talt,m:0};});
cv.addEventListener('pointermove',function(e){var tip=document.getElementById('smtip');
  if(drag){var dx=e.offsetX-drag.x,dy=e.offsetY-drag.y;drag.m=Math.max(drag.m,Math.abs(dx)+Math.abs(dy));if(drag.m>5){cv.classList.add('drag');var k=V.half/R*.9;V.taz=(drag.az-dx*k+360)%360;V.talt=Math.max(5,Math.min(90,drag.alt+dy*k));V.az=V.taz;V.alt=V.talt;tip.style.opacity=0;}return;}
  var b=pickHit(e.offsetX,e.offsetY);cv.style.cursor=b?'pointer':'grab';if(b){tip.textContent=b.n;tip.style.left=e.offsetX+'px';tip.style.top=e.offsetY+'px';tip.style.opacity=1;}else tip.style.opacity=0;});
cv.addEventListener('pointerup',function(e){cv.classList.remove('drag');if(drag&&drag.m<=5){var b=pickHit(e.offsetX,e.offsetY);if(b){if(b.go)location.href=b.go;else if(b.shower){var p=S.date.split('-');showerInfo(b.shower,+p[0],+p[1],+p[2]);}else if(b.info)showInfo(b.info);}}drag=null;});
cv.addEventListener('pointerleave',function(){document.getElementById('smtip').style.opacity=0;});
cv.addEventListener('wheel',function(e){e.preventDefault();V.thalf=Math.max(20,Math.min(120,V.thalf*(e.deltaY<0?.9:1.1)));},{passive:false});
cv.addEventListener('dblclick',function(){V.taz=180;V.talt=90;V.thalf=90;sel.hidden=true;});
requestAnimationFrame(frame);
})();
